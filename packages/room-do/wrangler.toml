name = "openbid-rooms"
main = "src/index.ts"
compatibility_date = "2026-03-10"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDO"

# APPLIED. Deployed 2026-08-27 as openbid-rooms (version
# 5f9ee71f-9c20-4e97-b4a9-2762c0595382) to
# https://openbid-rooms.shivangraval5789.workers.dev.
#
# This block is now FROZEN. Cloudflare migrations are append-only once
# applied: do not edit this class list or this tag. Adding a Durable Object
# class from here on must go in a NEW [[migrations]] block with its own tag
# (v2, v3, ...). Editing "v1" after the fact desynchronises Cloudflare's
# record of applied migrations from the file and the deploy fails, or worse
# succeeds against the wrong assumption.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO", "LobbyDO"]

# DATABASE_URL is deliberately NOT declared here as a [vars] entry. A
# plaintext [vars] value takes precedence over a Workers *secret* of the
# same name at deploy time, so a [vars] entry — even an empty placeholder —
# would silently reset the real credential to "" on every
# `wrangler deploy`, breaking archiving in production with no error and no
# failing test. Set the real value once with:
#   npx wrangler secret put DATABASE_URL
# For local dev, put it in a gitignored `.dev.vars` file instead:
#   DATABASE_URL=postgres://...
# `wrangler dev` loads `.dev.vars` automatically; it is never committed.
