name = "openbid-rooms"
main = "src/index.ts"
compatibility_date = "2026-03-10"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# DATABASE_URL is deliberately NOT declared here as a [vars] entry. A
# plaintext [vars] value takes precedence over a Workers *secret* of the
# same name at deploy time, so a [vars] entry — even an empty placeholder —
# would silently reset the real credential to "" on every
# `wrangler deploy`, breaking archiving in production with no error and no
# failing test. Set the real value once with:
#   npx wrangler secret put DATABASE_URL
# For local dev, put it in a gitignored `.dev.vars` file instead:
#   DATABASE_URL=postgres://...
# `wrangler dev` loads `.dev.vars` automatically; it is never committed.
